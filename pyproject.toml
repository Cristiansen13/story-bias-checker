[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biasprobe"
version = "0.1.0"
description = "Generate stories with a suite of LLMs, annotate perceived social biases, and train a human-in-the-loop bias detector."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
biasprobe = "biasprobe.cli:main"

[tool.setuptools.packages.find]
include = ["biasprobe*"]

[tool.setuptools.package-data]
"biasprobe.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
